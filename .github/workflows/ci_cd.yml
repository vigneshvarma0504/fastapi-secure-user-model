name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    # Define environment variables for the database used in integration tests
    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: ci_db
      # FIX: The application itself (app/main.py) uses this URL for initialization. 
      # Must use port 5433 to match the service mapping below.
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5433/ci_db
      
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        # FIX: Map the internal port (5432) to an external port (5433) to avoid conflict.
        ports:
          - 5433:5432 
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # FIX: Explicitly install the pydantic[email] dependency needed for EmailStr
          pip install 'pydantic[email]'

      - name: Wait for PostgreSQL to be ready
        run: |
          # Wait for connection to the mapped port 5433
          while ! nc -z localhost 5433; do   
            sleep 1 
          done
        
      - name: Run Tests (Unit and Integration)
        env:
          # TEST_DATABASE_URL must match the exposed port 5433
          TEST_DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5433/${{ env.POSTGRES_DB }}
        run: |
          # Use python -m pytest to avoid the ModuleNotFoundError
          python -m pytest tests/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        if: success() && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # !!! REPLACE vigneshvarma05 WITH YOUR DOCKER HUB USERNAME !!!
          tags: vigneshvarma05/fastapi-secure-app:latest 
          file: Dockerfile
